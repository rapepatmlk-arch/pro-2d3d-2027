<!doctype html>
<html lang="th" data-theme="navy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pro2D-2027">
<meta name="theme-color" content="#13214a">
<title>Pro2D-2027</title>
<link rel="manifest" href="manifest-2d.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/p23.css">
<style>
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.layers { position: absolute; right: 10px; top: 10px; bottom: 58px; width: 270px; background: var(--bar); color: var(--text); border-radius: 14px; padding: 10px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.45); display: none; flex-direction: column; z-index: 6; }
.layers.show { display: flex; }
.layers h4 { font-size: 15px; margin: 2px 4px 8px; display: flex; align-items: center; gap: 8px; }
.layers h4 button { margin-left: auto; font-size: 12px; padding: 5px 9px; border-radius: 8px; background: var(--btn); }
.lylist { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.ly { display: flex; align-items: center; gap: 9px; padding: 9px 6px; border-bottom: 1px solid var(--line); }
.ly .sw { width: 13px; height: 13px; border-radius: 3px; flex: none; border: 1px solid rgba(255,255,255,.25); }
.ly span.n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tg { width: 40px; height: 24px; border-radius: 12px; background: var(--accent); position: relative; flex: none; }
.tg::after { content: ""; position: absolute; right: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: all .15s; }
.tg.off { background: #56607a; } .tg.off::after { right: 19px; }
.tabs { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 5px; z-index: 5; max-width: calc(100% - 20px); overflow-x: auto; scrollbar-width: none; }
.tabs button { padding: 9px 14px; border-radius: 10px; background: rgba(19,33,74,.92); color: #fff; font-size: 13px; white-space: nowrap; }
.tabs button.on { background: var(--accent); color: var(--chip); font-weight: 700; }
.findbar { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); display: none; gap: 6px; background: var(--bar); padding: 8px; border-radius: 12px; z-index: 7; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
.findbar.show { display: flex; }
.findbar input { font: inherit; font-size: 16px; padding: 8px 10px; border-radius: 8px; border: 0; width: 220px; user-select: text; -webkit-user-select: text; }
.done { position: absolute; right: 12px; bottom: 12px; z-index: 6; display: none; }
.done.show { display: block; }
.done button { padding: 11px 18px; border-radius: 12px; background: var(--accent); color: var(--chip); font-weight: 700; font-size: 15px; }
</style>
</head>
<body>
<div class="top">
  <div class="tile"><img src="logo.jpg" alt="PRO-CON"></div>
  <div class="name">Pro2D<b>-2027</b></div>
  <button class="pill" id="bOpen">📂 <span data-t="open"></span></button>
  <div class="sp"></div>
  <div class="seg"><button data-theme-btn="navy" data-t="th_navy"></button><button data-theme-btn="blueprint" data-t="th_blue"></button><button data-theme-btn="graphite" data-t="th_graph"></button></div>
  <div class="seg"><button data-lang-btn="th">ไทย</button><button data-lang-btn="en">EN</button></div>
</div>
<div class="tools" id="tools">
  <button class="t on" data-tool="pan"><i>✋</i><span data-t="t_pan"></span></button>
  <button class="t" data-tool="zoom"><i>🔍</i><span data-t="t_zoom"></span></button>
  <button class="t" id="bFit"><i>⛶</i><span data-t="t_fit"></span></button>
  <button class="t" data-tool="zwin"><i>▭</i><span data-t="t_zwin"></span></button>
  <div class="sep"></div>
  <button class="t" data-tool="dist"><i>📏</i><span data-t="t_dist"></span></button>
  <button class="t" data-tool="angle"><i>∠</i><span data-t="t_angle"></span></button>
  <button class="t" data-tool="area"><i>▱</i><span data-t="t_area"></span></button>
  <div class="sep"></div>
  <button class="t" id="bLayers"><i>☰</i><span data-t="t_layers"></span></button>
  <button class="t" id="bFind"><i>🔎</i><span data-t="t_find"></span></button>
  <button class="t" id="bBg"><i>◐</i><span data-t="t_bg"></span></button>
</div>
<div class="row2">
  <span data-t="drawing"></span> <span class="chipb on" id="fname">—</span><span id="finfo"></span>
  <span class="sp"></span>
  <span data-t="show_in"></span>
  <button class="chipb" data-unit="mm" data-t="u_mm"></button><button class="chipb" data-unit="m" data-t="u_m"></button><button class="chipb" data-unit="in" data-t="u_in"></button>
</div>
<div class="body" id="body">
  <canvas id="cv"></canvas>
  <div class="empty" id="empty"><b data-t="empty_t"></b><span data-t="empty_s"></span></div>
  <div class="readout" id="readout"></div>
  <div class="layers" id="layers"><h4><span data-t="t_layers_h"></span><button id="lyAll" data-t="all_on"></button><button id="lyClose">✕</button></h4><div class="lylist" id="lylist"></div></div>
  <div class="tabs" id="tabs"></div>
  <div class="findbar" id="findbar"><input id="findq" type="search" autocomplete="off"><button class="chipb" id="findGo" data-t="find_next"></button><button class="chipb" id="findX">✕</button></div>
  <div class="done" id="done"><button id="doneBtn" data-t="area_done"></button></div>
</div>
<div class="toast" id="toast"></div>
<div class="busy" id="busy"><div><i class="spin"></i><span></span></div></div>
<script src="js/common.js"></script>
<script src="js/dxfview.js"></script>
<script src="js/pro2d.js"></script>
</body>
</html>
