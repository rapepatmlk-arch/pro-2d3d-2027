<style>
.body { display: flex; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.main { flex: 1 1 50%; position: relative; min-width: 0; }
.right { flex: 1 1 50%; display: flex; flex-direction: column; border-left: 3px solid var(--bar); min-width: 0; position: relative; }
.pane { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.pane + .pane { border-top: 3px solid var(--bar); }
.ph { display: flex; align-items: center; gap: 2px; padding: 4px 6px; background: var(--bar); color: var(--text); font-size: 13px; white-space: nowrap; overflow-x: auto; scrollbar-width: none; flex: none; position: relative; z-index: 3; }
.ph::-webkit-scrollbar { display: none; }
.ph b { margin: 0 6px 0 2px; }
.ph button { padding: 7px 9px; border-radius: 8px; }
.ph button.on { background: var(--btn); box-shadow: inset 0 -2px 0 var(--accent); }
.ph button.cut { color: #ff7a7a; }
.ph .r { margin-left: auto; }
.pv, .mv { flex: 1; position: relative; touch-action: none; }
.mv { position: absolute; inset: 0; }
.gest { white-space: pre-line; position: absolute; left: 10px; bottom: 10px; background: rgba(15,27,61,.82); color: #fff; font-size: 12px; padding: 7px 11px; border-radius: 10px; line-height: 1.55; pointer-events: none; transition: opacity .5s; z-index: 4; }
.gest.hide { opacity: 0; }
.lbl { position: absolute; transform: translate(-50%, -130%); background: #fff; color: #13214a; font-weight: 700; font-size: 13px; padding: 4px 9px; border-radius: 8px; box-shadow: 0 3px 10px rgba(0,0,0,.35); pointer-events: none; white-space: nowrap; z-index: 3; }
.slider { -webkit-appearance: none; appearance: none; width: 180px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.2); flex: none; touch-action: pan-x; }
.slider::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
.slider::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 0; }
.slider[disabled] { opacity: .35; }
#cutAt { min-width: 92px; display: inline-block; }
.done { position: absolute; right: 12px; bottom: 12px; z-index: 6; display: none; }
.done.show { display: block; }
.done button { padding: 11px 18px; border-radius: 12px; background: var(--accent); color: var(--chip); font-weight: 700; font-size: 15px; }
.empty { z-index: 2; white-space: pre-line; }
/* compact toolbars (half height): icon and label on one line */
.tools { padding: 2px 6px; gap: 1px; }
.tools .t { flex-direction: row; gap: 4px; min-width: 0; padding: 3px 8px; border-radius: 8px; font-size: 11px; }
.tools .t i { font-size: 14px; }
.tools .sep { margin: 2px 4px; }
.row2 { padding: 2px 8px; gap: 5px; font-size: 11px; }
.row2 .chipb { padding: 3px 8px; border-radius: 7px; font-size: 11px; }
.slider { width: 150px; height: 4px; }
.slider::-webkit-slider-thumb { width: 18px; height: 18px; }
.slider::-moz-range-thumb { width: 18px; height: 18px; }
/* elevation headers: a slim strip on the pane's right side, text at 2/3 size */
.pane { flex-direction: row-reverse; }
.pane + .pane { border-top: 3px solid var(--bar); }
.ph { flex-direction: column; align-items: stretch; gap: 1px; padding: 3px 2px; width: 46px; font-size: 9px; overflow-x: hidden; overflow-y: auto; }
.ph b { margin: 1px 0 3px; text-align: center; font-size: 8px; opacity: .8; }
.ph button { padding: 4px 2px; border-radius: 6px; text-align: center; }
.ph button.on { box-shadow: inset -2px 0 0 var(--accent); }
.ph .r { margin: auto 0 0; }
</style>

<body>
<div class="top">
  <div class="tile"><img src="logo.jpg" alt="PRO-CON"></div>
  <div class="name">Pro3D<b>-2027</b></div>
  <button class="pill" id="bOpen">📂 <span data-t="open"></span></button>
  <button class="pill" id="bSample">⌂ <span data-t="sample"></span></button>
  <div class="sp"></div>
  <div class="seg"><button data-theme-btn="navy" data-t="th_navy"></button><button data-theme-btn="blueprint" data-t="th_blue"></button><button data-theme-btn="graphite" data-t="th_graph"></button></div>
  <div class="seg"><button data-lang-btn="th">ไทย</button><button data-lang-btn="en">EN</button></div>
</div>
<div class="tools" id="tools">
  <button class="t" id="bUndo" disabled><i>↶</i><span data-t="t_undo"></span></button>
  <button class="t" id="bRedo" disabled><i>↷</i><span data-t="t_redo"></span></button>
  <div class="sep"></div>
  <button class="t on" data-tool="orbit"><i>⟲</i><span data-t="t_orbit"></span></button>
  <button class="t" data-tool="pan"><i>✋</i><span data-t="t_pan"></span></button>
  <button class="t" data-tool="zoom"><i>🔍</i><span data-t="t_zoom"></span></button>
  <button class="t" id="bFit"><i>⛶</i><span data-t="t_fit"></span></button>
  <div class="sep"></div>
  <button class="t" data-tool="dist"><i>📏</i><span data-t="t_dist"></span></button>
  <button class="t" data-tool="angle"><i>∠</i><span data-t="t_angle"></span></button>
  <button class="t" data-tool="area"><i>▱</i><span data-t="t_area"></span></button>
  <div class="sep"></div>
  <button class="t" data-tool="hide"><i>🙈</i><span data-t="t_hide"></span></button>
  <button class="t" id="bShow"><i>👁</i><span data-t="t_show"></span></button>
  <button class="t" id="bXray"><i>◫</i><span data-t="t_xray"></span></button>
</div>
<div class="row2">
  <span data-t="cut"></span>
  <button class="chipb" data-axis="x" data-t="ax_x"></button><button class="chipb" data-axis="y" data-t="ax_y"></button><button class="chipb" data-axis="z" data-t="ax_z"></button>
  <input type="range" class="slider" id="cutS" min="0" max="1000" value="500" disabled>
  <span id="cutAt"></span>
  <button class="chipb" id="bFlip" data-t="flip" disabled></button>
  <span data-t="show_in"></span>
  <button class="chipb" data-cutpane="0" data-t="p_top"></button><button class="chipb" data-cutpane="1" data-t="p_bottom"></button><button class="chipb" id="bCutOff" data-t="cut_off"></button>
  <span class="sp"></span>
  <span data-t="unit"></span>
  <button class="chipb" data-unit="m" data-t="u_m"></button><button class="chipb" data-unit="in" data-t="u_in"></button>
</div>
<div class="body" id="body">
  <canvas id="gl"></canvas>
  <div class="main" id="main">
    <div class="mv" id="mv"></div>
    <div class="readout" id="readout"></div>
    <div class="gest" id="gest" data-t="gest"></div>
    <div class="done" id="done"><button id="doneBtn" data-t="clear_meas"></button></div>
  </div>
  <div class="right">
    <div class="pane" data-pane="0"><div class="ph"></div><div class="pv"></div></div>
    <div class="pane" data-pane="1"><div class="ph"></div><div class="pv"></div></div>
  </div>
  <div class="empty" id="empty"><b data-t="empty_t"></b><span data-t="empty_s"></span></div>
</div>
<div class="toast" id="toast"></div>
<div class="busy" id="busy"><div><i class="spin"></i><span></span></div></div>
