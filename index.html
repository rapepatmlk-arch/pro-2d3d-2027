<!doctype html>
<html lang="th" data-theme="navy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Pro-2D+3D 2027</title>
<link rel="icon" href="logo.jpg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pro-2D+3D">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1b3d">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">

  <!-- ===== Title bar + menus ===== -->
  <header class="titlebar">
    <img src="logo.jpg" alt="" class="tb-logo">
    <strong class="tb-name">Pro-2D+3D 2027</strong>
    <nav class="menubar">
      <div class="menu"><button class="menu-btn" data-i18n="m_file"></button>
        <div class="menu-pop">
          <button data-cmd="new"><span data-i18n="c_new"></span><kbd>Ctrl+N</kbd></button>
          <button data-cmd="open"><span data-i18n="c_open"></span><kbd>Ctrl+O</kbd></button>
          <button data-cmd="save"><span data-i18n="c_save"></span><kbd>Ctrl+S</kbd></button>
          <hr>
          <button data-cmd="exportDwg"><span data-i18n="c_exp_dwg"></span></button>
          <button data-cmd="exportDxf"><span data-i18n="c_exp_dxf"></span></button>
          <button data-cmd="exportIfc"><span data-i18n="c_exp_ifc"></span></button>
          <button data-cmd="exportObj"><span data-i18n="c_exp_obj"></span></button>
          <button data-cmd="exportPdf"><span data-i18n="c_exp_pdf"></span></button>
          <hr>
          <button data-cmd="sample"><span data-i18n="n_sample"></span></button>
        </div>
      </div>
      <div class="menu"><button class="menu-btn" data-i18n="m_edit"></button>
        <div class="menu-pop">
          <button data-cmd="undo"><span data-i18n="c_undo"></span><kbd>Ctrl+Z</kbd></button>
          <button data-cmd="redo"><span data-i18n="c_redo"></span><kbd>Ctrl+Y</kbd></button>
          <hr>
          <button data-cmd="delete"><span data-i18n="c_delete"></span><kbd>Del</kbd></button>
          <button data-cmd="clearRefs"><span data-i18n="c_clear_refs"></span></button>
        </div>
      </div>
      <div class="menu"><button class="menu-btn" data-i18n="m_view"></button>
        <div class="menu-pop">
          <button data-cmd="view2d"><span data-i18n="n_2d"></span></button>
          <button data-cmd="view3d"><span data-i18n="n_3d"></span></button>
          <button data-cmd="viewSplit"><span data-i18n="n_split"></span></button>
          <hr>
          <button data-cmd="fit"><span data-i18n="c_fit"></span><kbd>F</kbd></button>
        </div>
      </div>
      <div class="menu"><button class="menu-btn" data-i18n="m_help"></button>
        <div class="menu-pop">
          <button data-cmd="shortcuts"><span data-i18n="c_shortcuts"></span></button>
          <button data-cmd="about"><span data-i18n="c_about"></span></button>
        </div>
      </div>
    </nav>
    <span class="tb-doc" id="docName"></span>
    <div class="tb-right">
      <div class="seg" id="themeSeg">
        <button data-theme-btn="navy" data-i18n-title="th_navy"><i class="dot" style="background:#13214a;border-color:#c9a46a"></i><span data-i18n="th_navy"></span></button>
        <button data-theme-btn="blueprint" data-i18n-title="th_blue"><i class="dot" style="background:#fff;border-color:#1f5fd6"></i><span data-i18n="th_blue"></span></button>
        <button data-theme-btn="graphite" data-i18n-title="th_graph"><i class="dot" style="background:#1a1e26;border-color:#f2a33a"></i><span data-i18n="th_graph"></span></button>
      </div>
      <div class="seg" id="langSeg">
        <button data-lang-btn="th">ไทย</button>
        <button data-lang-btn="en">EN</button>
      </div>
    </div>
  </header>

  <!-- ===== Sidebar ===== -->
  <aside class="side">
    <div class="brand">
      <div class="logo-tile"><img src="logo.jpg" alt="PRO-CON"></div>
      <div>
        <h1>Pro-2D<span>+</span>3D <span>2027</span></h1>
        <small>2D · 3D · LIVE LINK</small>
      </div>
    </div>
    <button class="nav-item" data-nav="hub"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-i18n="n_home"></span></button>
    <button class="nav-item" data-nav="3d"><svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7z M12 12l9-5 M12 12v10 M12 12L3 7"/></svg><span data-i18n="n_3d"></span></button>
    <button class="nav-item" data-nav="2d"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 3v8h5v5h8"/></svg><span data-i18n="n_2d"></span></button>
    <button class="nav-item" data-nav="split"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="9" height="16" rx="1"/><rect x="13" y="4" width="9" height="16" rx="1"/></svg><span data-i18n="n_split"></span></button>
    <button class="nav-item" data-nav="open"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z M12 17v-6 M9 14l3-3 3 3"/></svg><span data-i18n="n_open"></span></button>
    <button class="nav-item" data-nav="sample"><svg viewBox="0 0 24 24"><path d="M3 21h18 M5 21V10l7-5 7 5v11 M9 21v-6h6v6"/></svg><span data-i18n="n_sample"></span></button>
    <div class="spacer"></div>
    <button class="nav-item" data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3 M12 19v3 M2 12h3 M19 12h3 M4.9 4.9l2.1 2.1 M17 17l2.1 2.1 M4.9 19.1L7 17 M17 7l2.1-2.1"/></svg><span data-i18n="n_settings"></span></button>
    <div class="ver">v2027.0 · GPL-3.0 · PRO CONSTRUCTION &amp; DESIGN</div>
  </aside>

  <!-- ===== Main ===== -->
  <main id="main">

    <!-- Hub -->
    <section class="view" id="view-hub">
      <div class="hero">
        <span class="eyebrow">PRO-2D+3D HUB</span>
        <h2 data-i18n="h_title"></h2>
        <p class="sub" data-i18n="h_sub"></p>
        <div class="cards">
          <div class="card" data-nav="3d-new">
            <div class="ill">
              <svg width="110" height="110" viewBox="0 0 110 110" fill="none"><g stroke="var(--chip3d)" stroke-width="2.2" stroke-linejoin="round">
                <path d="M55 30l32 16v30L55 92 23 76V46z" fill="color-mix(in srgb,var(--chip3d) 18%,transparent)"/>
                <path d="M23 46l32 16 32-16 M55 62v30"/>
                <path d="M55 12l18 9v17l-18 9-18-9V21z" fill="color-mix(in srgb,var(--chip3d) 45%,transparent)"/>
                <path d="M37 21l18 9 18-9 M55 30v17"/><path d="M10 82l40 20" stroke-width="3"/></g></svg>
            </div>
            <div class="body">
              <span class="chip" style="background:var(--chip3d)">3D</span>
              <h3>Pro 3D</h3>
              <p class="desc" data-i18n="c3_desc"></p>
              <div class="foot"><span>IFC · SKP · OBJ</span><span class="go" data-i18n="start"></span></div>
            </div>
          </div>
          <div class="link">
            <div class="bar"></div>
            <div class="pulse"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><path d="M4 9h13l-3-3 M20 15H7l3 3"/></svg></div>
            <small data-i18n="live"></small>
            <div class="bar"></div>
          </div>
          <div class="card c2d" data-nav="2d-new">
            <div class="ill">
              <svg width="110" height="110" viewBox="0 0 110 110" fill="none" stroke="var(--chip2d)" stroke-width="2.4">
                <rect x="12" y="20" width="80" height="76" rx="4" fill="color-mix(in srgb,var(--chip2d) 12%,transparent)"/>
                <rect x="20" y="28" width="64" height="60" rx="2"/><path d="M34 28v34h22v26 M34 48h-14 M56 62h28"/>
                <path d="M84 8l-8 22 M84 8l8 22" stroke-width="2.8"/></svg>
            </div>
            <div class="body">
              <span class="chip" style="background:var(--chip2d)">2D</span>
              <h3>Pro 2D</h3>
              <p class="desc" data-i18n="c2_desc"></p>
              <div class="foot"><span>DWG · DXF · PDF</span><span class="go" data-i18n="start"></span></div>
            </div>
          </div>
        </div>
      </div>
      <div class="lower">
        <div class="box">
          <h4><span data-i18n="recent"></span></h4>
          <div class="recent" id="recentList"></div>
        </div>
        <div class="box">
          <h4><span data-i18n="feat"></span></h4>
          <ul class="feat">
            <li><i>⇄</i><span><b data-i18n="ft1"></b><small data-i18n="ft1s"></small></span></li>
            <li><i>▦</i><span><b data-i18n="ft2"></b><small data-i18n="ft2s"></small></span></li>
            <li><i>⎘</i><span><b data-i18n="ft3"></b><small data-i18n="ft3s"></small></span></li>
          </ul>
        </div>
      </div>
    </section>

    <!-- Workspace (2D / 3D / split) -->
    <section class="view" id="view-work">
      <div class="ws-toolbar">
        <div class="tgroup tools2d">
          <button class="tbtn" data-tool="select" data-i18n-title="tl_select"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z"/></svg><span data-i18n="tl_select"></span></button>
          <button class="tbtn" data-tool="wall" data-i18n-title="tl_wall"><svg viewBox="0 0 24 24"><path d="M3 17h18v4H3z M3 17V7h4v10 M7 11h10"/></svg><span data-i18n="tl_wall"></span></button>
          <button class="tbtn" data-tool="door" data-i18n-title="tl_door"><svg viewBox="0 0 24 24"><path d="M4 20h16 M6 20V6 M6 6a14 14 0 0 1 14 14"/></svg><span data-i18n="tl_door"></span></button>
          <button class="tbtn" data-tool="window" data-i18n-title="tl_window"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="6"/><path d="M3 12h18"/></svg><span data-i18n="tl_window"></span></button>
          <button class="tbtn" data-tool="dim" data-i18n-title="tl_dim"><svg viewBox="0 0 24 24"><path d="M3 8v8 M21 8v8 M3 12h18 M6 10l-3 2 3 2 M18 10l3 2-3 2"/></svg><span data-i18n="tl_dim"></span></button>
        </div>
        <div class="tgroup">
          <button class="tbtn icon" data-cmd="undo" data-i18n-title="c_undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5 M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
          <button class="tbtn icon" data-cmd="redo" data-i18n-title="c_redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5 M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
          <button class="tbtn icon" data-cmd="delete" data-i18n-title="c_delete"><svg viewBox="0 0 24 24"><path d="M4 7h16 M9 7V4h6v3 M6 7l1 13h10l1-13"/></svg></button>
          <button class="tbtn icon" data-cmd="fit" data-i18n-title="c_fit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5 M15 4h5v5 M20 15v5h-5 M9 20H4v-5"/></svg></button>
        </div>
        <div class="tgroup defaults">
          <label><span data-i18n="p_thick"></span><input type="number" id="defT" step="0.01" min="0.05" value="0.20"></label>
          <label><span data-i18n="p_height"></span><input type="number" id="defH" step="0.1" min="0.5" value="3.00"></label>
          <label class="chk"><input type="checkbox" id="snapChk" checked><span data-i18n="snap"></span></label>
        </div>
        <div class="tgroup modes">
          <button class="tbtn" data-cmd="view2d">2D</button>
          <button class="tbtn" data-cmd="viewSplit">2D | 3D</button>
          <button class="tbtn" data-cmd="view3d">3D</button>
        </div>
      </div>
      <div class="ws-body">
        <div class="pane" id="pane2d"><canvas id="cv2d"></canvas><span class="pane-tag">2D · <span data-i18n="plan"></span></span><div class="hint" id="hint2d"></div></div>
        <div class="pane" id="pane3d"><span class="pane-tag tag3d">3D</span>
          <div class="cam-btns"><button data-cmd="camIso" data-i18n="cam_iso"></button><button data-cmd="camTop" data-i18n="cam_top"></button></div></div>
        <aside class="props" id="props"></aside>
      </div>
    </section>


    <!-- Settings -->
    <section class="view" id="view-settings">
      <div class="box page">
        <h2 data-i18n="n_settings"></h2>
        <div class="set-row"><span data-i18n="t_theme"></span><div class="seg" id="themeSeg2">
          <button data-theme-btn="navy"><span data-i18n="th_navy"></span></button>
          <button data-theme-btn="blueprint"><span data-i18n="th_blue"></span></button>
          <button data-theme-btn="graphite"><span data-i18n="th_graph"></span></button></div></div>
        <div class="set-row"><span data-i18n="t_lang"></span><div class="seg">
          <button data-lang-btn="th">ไทย</button><button data-lang-btn="en">English</button></div></div>
        <div class="set-row"><span data-i18n="snap_step"></span>
          <select id="snapStep"><option value="0.01">0.01 m</option><option value="0.05">0.05 m</option><option value="0.1" selected>0.10 m</option><option value="0.25">0.25 m</option><option value="0.5">0.50 m</option></select></div>
        <div class="set-row"><span data-i18n="pdf_paper"></span>
          <select id="pdfPaper"><option value="A3" selected>A3</option><option value="A4">A4</option><option value="A2">A2</option><option value="A1">A1</option></select></div>
        <div class="set-row"><span data-i18n="pdf_in_scale"></span>
          <select id="pdfInScale"><option value="20">1:20</option><option value="50">1:50</option><option value="100" selected>1:100</option><option value="200">1:200</option><option value="500">1:500</option><option value="1000">1:1000</option></select></div>
        <h3 data-i18n="formats"></h3>
        <table class="qtable" id="fmtTable"></table>
      </div>
    </section>
  </main>

  <footer class="status">
    <span class="ok">● <span data-i18n="s_ready"></span></span>
    <span><span class="live-dot" id="liveDot"></span> <span data-i18n="s_sync"></span></span>
    <span id="stEngine"></span>
    <span id="stCursor"></span>
    <span id="stSel"></span>
    <span class="r" data-i18n="s_unit"></span>
  </footer>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modal-box"><div id="modalBody"></div><button class="btn" id="modalClose" data-i18n="close"></button></div></div>
<input type="file" id="fileInput" accept=".p23,.json,.dxf,.obj,.dwg,.ifc,.skp,.pdf" hidden>

<script type="importmap">{"imports":{"earcut":"./vendor/earcut/earcut.js","fflate":"./vendor/fflate/browser.js","flatbuffers":"./vendor/flatbuffers/flatbuffers.js"}}</script>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/OBJLoader.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="js/i18n.js"></script>
<script src="js/model.js"></script>
<script src="js/sample.js"></script>
<script src="js/editor2d.js"></script>
<script src="js/view3d.js"></script>
<script src="js/io-dxf.js"></script>
<script src="js/io-obj.js"></script>
<script src="js/io-pdf.js"></script>
<script src="js/io-ext.js"></script>
<script src="js/io-ifc.js"></script>
<script src="js/app.js"></script>
</body>
</html>
